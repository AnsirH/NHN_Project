<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BalanceLab</title>
<style>
:root{
  --ink:#1b1c1e; --ink-2:#5c6066; --ink-3:#8b9096;
  --line:#e2e4e7; --line-2:#c9ccd1;
  --bg:#fbfbfa; --card:#ffffff; --soft:#f4f5f6;
  --left:#3b6fd4; --right:#c2571f;
  --ok:#2f7d4f; --ok-bg:#e6f2ea;
  --bad:#b3261e; --bad-bg:#fbeceb;
  --warn:#8a5b00; --warn-bg:#fdf3e0;
  --accent:#3b6fd4; --accent-bg:#eaf0fb;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",
  "Malgun Gothic","Apple SD Gothic Neo",sans-serif; -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"D2Coding",monospace}
h1,h2,h3{font-weight:500;margin:0}
a{color:var(--accent)}
button{
  font:inherit; font-size:13px; background:transparent; color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r); padding:6px 12px; cursor:pointer;
}
button:hover{background:var(--soft)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4; cursor:default; transform:none}
button.primary{border-color:var(--accent); color:var(--accent); background:var(--accent-bg)}
select,input[type=text],input[type=number]{
  font:inherit; font-size:13px; background:var(--card); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r); padding:6px 9px; height:32px;
}
input[type=range]{accent-color:var(--accent)}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px 64px}
header.top{border-bottom:1px solid var(--line); background:var(--card); margin-bottom:24px}
header.top .wrap{padding-top:16px; padding-bottom:16px; display:flex; align-items:center; gap:14px}
.brand{font-size:16px; font-weight:500}
.crumb{color:var(--ink-3); font-size:13px}
.crumb a{text-decoration:none}
.stamp{margin-left:auto; font-size:12px; color:var(--ink-3)}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px}
.metric{background:var(--soft); border-radius:var(--r); padding:12px 14px}
.metric .k{font-size:12px; color:var(--ink-2)}
.metric .v{font-size:24px; font-weight:500; line-height:1.3}
.bar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.spacer{margin-left:auto}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 9px; border-radius:20px}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.bad{background:var(--bad-bg); color:var(--bad)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.info{background:var(--accent-bg); color:var(--accent)}
table{width:100%; border-collapse:collapse}
th{font-size:12px; font-weight:400; color:var(--ink-3); text-align:left; padding:0 10px 8px}
td{padding:9px 10px; border-top:1px solid var(--line); vertical-align:middle}
tbody tr:hover{background:var(--soft); cursor:pointer}
.name{font-size:13px}
.sub{font-size:12px; color:var(--ink-3)}
.track{position:relative; height:20px; background:var(--soft); border-radius:4px; min-width:180px}
.track .band{position:absolute; top:0; bottom:0; background:var(--ok-bg); border-radius:3px}
.track .mark{position:absolute; top:-2px; bottom:-2px; width:2px; border-radius:1px}
.track .val{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
  padding-right:6px; font-size:12px; color:var(--ink-2)}
.track .ghost{position:absolute; top:2px; bottom:2px; width:2px; background:var(--line-2)}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:20px; align-items:start}
.seeds{display:grid; grid-template-columns:repeat(25,1fr); gap:2px}
.seed{height:12px; border-radius:2px; cursor:pointer; border:0; padding:0}
.seed.sel{outline:2px solid var(--ink); outline-offset:1px}
.seed.has{box-shadow:inset 0 0 0 2px #fff}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0}
.kv span:last-child{font-family:ui-monospace,Consolas,monospace}
.cmd{background:var(--soft); border:1px solid var(--line); border-radius:var(--r);
  padding:9px 11px; font-family:ui-monospace,Consolas,monospace; font-size:12px;
  white-space:pre-wrap; word-break:break-all; margin:8px 0 0}
.empty{text-align:center; padding:56px 20px; color:var(--ink-2)}
.empty h2{margin-bottom:10px}
.legend{display:flex; gap:16px; font-size:12px; color:var(--ink-2); align-items:center}
.dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.note{font-size:12px; color:var(--ink-2); margin-top:10px}
.banner{border:1px solid var(--bad); background:var(--bad-bg); color:var(--bad);
  border-radius:var(--r); padding:10px 14px; margin-bottom:18px; font-size:13px}
.sect{margin-bottom:12px; font-size:12px; color:var(--ink-3)}
canvas{display:block; width:100%; background:var(--soft); border-radius:var(--r)}
.ctrl{display:flex; align-items:center; gap:10px; margin-top:10px}
.ctrl input[type=range]{flex:1}
.slider{margin-bottom:12px}
.slider label{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-2); margin-bottom:3px}
.slider label b{font-weight:400; font-family:ui-monospace,Consolas,monospace; color:var(--ink)}
.slider input[type=range]{width:100%}
.slider.dirty label b{color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand">BalanceLab</span>
    <span class="crumb" id="crumb"></span>
    <span class="stamp" id="stamp"></span>
  </div>
</header>
<main class="wrap" id="app"></main>
<script src="../results/index.js"></script>
<script src="app.js"></script>
<script src="replay.js"></script>
</body>
</html>
