name: WebGL build and Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Never execute fork PR code on the workstation hosting this runner.
    if: github.repository == 'AnsirH/NHN_Project' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: [self-hosted, Windows, X64, unity-webgl]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean previous source and preserve local Unity cache
        run: |
          $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if (Test-Path -LiteralPath (Join-Path $root '.git')) {
            Push-Location $root
            try {
              $actual = & git rev-parse --show-toplevel
              if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($actual.Trim()) -ne $root) {
                throw 'Refusing to clean a repository outside GITHUB_WORKSPACE.'
              }
              & git reset --hard
              if ($LASTEXITCODE -ne 0) { throw 'Cannot reset the previous CI checkout.' }
              & git clean -ffdx -e /Library/
              if ($LASTEXITCODE -ne 0) { throw 'Cannot clean the previous CI checkout.' }
            } finally { Pop-Location }
          }

      - name: Checkout source and real LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false
          persist-credentials: false

      - name: Test and build with Unity CLI
        run: ./Tools/CI/Invoke-WebGLCI.ps1

      - name: Keep tests and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-logs-${{ github.run_id }}
          path: Logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Keep downloadable WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-${{ github.sha }}
          path: Build/WebGL/
          retention-days: 14
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: Tools/CI
      - uses: actions/download-artifact@v4
        with:
          name: WebGL-${{ github.sha }}
          path: Build/WebGL/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Load WebGL at the Pages project path
        run: python Tools/CI/Smoke-WebGL.py
      - name: Package verified Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Build/WebGL/
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-browser-${{ github.run_id }}
          path: Logs/browser/
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy successful build
        id: deployment
        uses: actions/deploy-pages@v4
